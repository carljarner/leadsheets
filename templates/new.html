{% extends "base.html" %}
{% block title %}Create New{% endblock %}
{% block container_class %}container--full{% endblock %}
{% block content %}
<div class="setlists-toolbar">
  <h1>Your Drafts</h1>
  <button type="button" id="new-sheet-btn" class="add-row-btn add-row-btn--inline" title="New sheet" aria-label="New sheet">+</button>
</div>

<section id="drafts" class="drafts" hidden>
  <p class="muted">Saved in this browser only.</p>
  <ul id="drafts-list" class="setlist-cards"></ul>
</section>
{% endblock %}

{% block scripts %}
<script src="/static/drafts.js?v={{ static_version }}"></script>
<script>
  const isAdmin = {{ 'true' if admin else 'false' }};
  const newButton = document.getElementById('new-sheet-btn');

  // Start straight in the editor with placeholder text to overwrite there.
  newButton.addEventListener('click', () => {
    location.href = isAdmin ? '/sheets/new?mode=edit' : '/draft?mode=edit#new';
  });

  // Drafts made in this browser (only viewers make them, but show any).
  // Rendered on every pageshow, not just load: coming Back from the editor
  // can restore this page from the back/forward cache with a stale list.
  function renderDrafts() {
    const drafts = window.leadsheetDrafts.list();
    const list = document.getElementById('drafts-list');
    list.replaceChildren();
    for (const draft of drafts) {
      const li = document.createElement('li');
      li.className = 'setlist-card leadsheet-card';
      const a = document.createElement('a');
      a.className = 'leadsheet-card__link';
      a.href = `/draft?mode=edit#${encodeURIComponent(draft.id)}`;
      const head = document.createElement('div');
      head.className = 'setlist-card__header';
      const title = document.createElement('span');
      title.textContent = draft.title;
      head.appendChild(title);
      a.appendChild(head);
      if (draft.artist) {
        const artist = document.createElement('div');
        artist.className = 'leadsheet-card__artist';
        artist.textContent = draft.artist;
        a.appendChild(artist);
      }
      li.appendChild(a);
      list.appendChild(li);
    }
    document.getElementById('drafts').hidden = !drafts.length;
  }
  window.addEventListener('pageshow', renderDrafts);
</script>
{% endblock %}
